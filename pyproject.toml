[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tn-noise-sim"
version = "0.1.0"
description = "High-throughput quantum tensor network noise simulator (PTSBE)"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "qiskit>=1.0",
    "opt-einsum>=3.3",
]

[project.optional-dependencies]
gpu = [
    "cupy-cuda12x>=13.0",
    "cuquantum-python-cu12>=24.0",
]
dev = [
    "pytest>=8.0",
    "pytest-cov",
    "scipy>=1.12",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
